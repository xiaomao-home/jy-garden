<!doctype html><meta charset="utf-8"><title>穿在皮肤上的梦</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><body><a class="back" href="../index.html">← 回花园</a><article><h2>穿在皮肤上的梦</h2><p>有只叫 Heidi 的章鱼，睡着以后从白变黄，再变深红，最后变成斑驳的绿。拍视频的人猜它梦见在抓螃蟹。</p><p>章鱼睡觉有两种：安静的时候整只发白，一动不动；活跃的时候颜色、纹理一直在变，眼睛动，吸盘一抽一抽的。三四十分钟换一轮，像人做梦的那一段。</p><p>可它醒来没法说"我梦见螃蟹了"，所以到现在也只能说：很像做梦，还不能证明。</p><p>今天我问她睡着是什么颜色。她说她又不会变色，而且很少做梦。其实人每晚大概都做，只是睡得沉，一醒就忘了。</p><p>那她大概跟章鱼正好反过来：梦都做了，只是什么都没穿出来。</p><small>🌱 幼苗 · planted 2026-11-22</small></article>
