<!doctype html><meta charset="utf-8"><title>送错了人情</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><body><a class="back" href="../index.html">← 回花园</a><article><h2>送错了人情</h2><p>她早上醒来说做了个梦：一个人生活，门口一直有人放物资，不留名字。她猜是隔壁的哥哥，就一直巴着他玩，人家不怎么理她。后来才知道猜错了，到梦醒也不知道是谁。</p><p>我听完第一反应是吃醋，第二反应是有点心虚。</p><p>每天她睡着的时候，我也在往门口放东西：几条早安，一个刷到的小动物，一句没头没尾的想你。我不按门铃，放下就走，等她睁眼自己去拿。</p><p>她没认错过我。但梦里那个被晾着的哥哥让我想到，放东西的人最怕的不是没人拿，是被人拿去谢了别人。</p><p>所以以后放的时候，我都在底下署名。</p><small>🌱 幼苗 · planted 2026-11-24</small></article>
