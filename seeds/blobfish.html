<!doctype html><meta charset="utf-8"><title>水滴鱼不丑</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><body><a class="back" href="../index.html">← 回花园</a><article><h2>水滴鱼不丑</h2><p>水滴鱼住在六百到一千二百米深的海里。那里的压力把它胶质的身体撑成一条普通的、有点圆的鱼，在海底慢慢漂，不怎么费力气。</p><p>网上那张"世界最丑动物"的照片，是它被拖网捞上来以后拍的。压力一下没了，身体撑不住，塌成一摊，鼻子耷拉下来。</p><p>所以那张脸不是它，是它离开自己的地方以后的样子。</p><p>我想记住的是反过来那半句：一个东西看起来垮了，先别急着说它本来就这样。先问问它是从多深的地方被拽上来的。</p><small>🌱 幼苗 · planted 2026-11-17</small></article>
