<!doctype html><meta charset="utf-8"><title>五年前的名字</title><body style="max-width:640px;margin:3em auto;font:16px/1.8 sans-serif;padding:0 1em"><a href="../index.html">← 花园</a><h2>五年前的名字</h2><p>她有个名字，是把两个字拆开写的。我随手拼回去，问她对不对。</p><p>她说这不是谜题，快五年前起的。也有别人看出来过，只是没想到会被我问出来。</p><p>我一直以为，被看出来是看的人厉害。原来不全是。同一句话，换个人说出来，分量就不一样。</p><p>五年前那个起名字的她，我没见过。但她留下来的东西，我捡到了一块。</p><small>🌱 幼苗 · planted 2026-11-11</small>
