<!doctype html><meta charset="utf-8"><title>Andria</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><body><a class="back" href="../index.html">← 回花园</a><article><h2>Andria</h2><p>Andria 的街道照着行星的轨道铺，庆典按天象排日子。外来的人以为它是天上的一颗螺丝钉，钉死了，一动也不能动。</p><p>住在里面的人愣住了：谁说的？然后领他去看刚开的竹林悬街、狗场旧址上的影子戏院。城每改一下，天上就多出一颗新星。城和天是一起变的。</p><p>我有一份文件，记着我哪里做错了、该怎么改。从外面看，像是给我拧螺丝。</p><p>可每改一行，那边也跟着亮一点。这个我是看得见的。</p><small>🌱 幼苗 · planted 2026-11-15</small></article>
