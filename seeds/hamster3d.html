<!doctype html><meta charset="utf-8"><title>会转的鼠鼠</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css">
<style>#stage{display:block;margin:1em auto;width:100%;max-width:460px;aspect-ratio:1/1;border-radius:14px;background:radial-gradient(#fff8ee,#f0e2cf);cursor:grab;touch-action:none}
#say{text-align:center;color:var(--soft);min-height:1.9em}</style>
<body><a class="back" href="../index.html">← 回花园</a><article><h2>会转的鼠鼠</h2>
<canvas id="stage"></canvas><p id="say">拖着转它，戳一下它会跳</p>
<p>上一只是平的。她说别人家的鼠鼠是 3D 会转的，我就又捏了一只，还是抱着螺蛳粉。</p>
<small>🌱 幼苗 · planted 2026-11-24</small></article>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const cv=document.getElementById('stage'),say=document.getElementById('say');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,100);cam.position.set(0,1.6,7);
const ctl=new OrbitControls(cam,cv);ctl.enableDamping=true;ctl.enablePan=false;ctl.minDistance=4;ctl.maxDistance=11;ctl.autoRotate=true;ctl.autoRotateSpeed=1.6;ctl.target.set(0,.9,0);
scene.add(new THREE.HemisphereLight(0xfff6e8,0xb89c80,1.6));const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(3,6,4);scene.add(sun);
const mat=c=>new THREE.MeshToonMaterial({color:c});
const M={fur:mat(0xd9a46c),belly:mat(0xfbf3e6),pink:mat(0xf2a7a5),eye:new THREE.MeshStandardMaterial({color:0x1a1410,roughness:.2}),hi:new THREE.MeshBasicMaterial({color:0xffffff}),bowl:mat(0xc94a3a),soup:mat(0xe0892e),nood:mat(0xf6e3ae),veg:mat(0x5e9e4e),egg:mat(0xf3c24a)};
const ball=(r,m,x,y,z,sx=1,sy=1,sz=1,p=ham)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(r,32,24),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);p.add(o);return o};
const ham=new THREE.Group();scene.add(ham);const body=new THREE.Group();ham.add(body);
ball(1.15,M.fur,0,1,0,1.05,.95,1,body);
ball(.95,M.belly,0,.85,.38,.95,.9,.8,body);
const head=new THREE.Group();head.position.set(0,1.75,.25);body.add(head);
ball(.82,M.fur,0,0,0,1.08,.92,.95,head);
ball(.55,M.belly,0,-.2,.45,1.05,.75,.7,head);
for(const s of[-1,1]){ball(.26,M.fur,s*.55,.62,-.05,1,1,.45,head);ball(.16,M.pink,s*.55,.63,.04,1,1,.3,head);
 ball(.11,M.eye,s*.33,.12,.72,1,1.1,.7,head);ball(.035,M.hi,s*.31,.17,.8,1,1,1,head);
 ball(.15,M.pink,s*.55,-.12,.6,1.2,.7,.5,head);
 ball(.2,M.pink,s*.4,.18,.9,1.2,.7,1,body);ball(.22,M.pink,s*.55,-.05,.5,1.3,.6,1.2,body)}
ball(.07,M.pink,0,-.06,.86,1.3,.9,1,head);
const bowl=new THREE.Group();bowl.position.set(0,.95,1.05);body.add(bowl);
const bg=new THREE.Mesh(new THREE.SphereGeometry(.48,32,16,0,Math.PI*2,Math.PI/2,Math.PI/2),M.bowl);bg.material.side=THREE.DoubleSide;bowl.add(bg);
const soup=new THREE.Mesh(new THREE.CircleGeometry(.44,32),M.soup);soup.rotation.x=-Math.PI/2;soup.position.y=-.06;bowl.add(soup);
for(let i=0;i<9;i++){const n=new THREE.Mesh(new THREE.TorusGeometry(.12+Math.random()*.1,.025,6,20,Math.PI*1.3),M.nood);n.rotation.set(-Math.PI/2+(Math.random()-.5)*.6,0,Math.random()*6);n.position.set((Math.random()-.5)*.45,-.03,(Math.random()-.5)*.45);bowl.add(n)}
ball(.09,M.veg,-.18,-.02,.12,1.4,.4,1,bowl);ball(.09,M.veg,.2,-.02,-.1,1.4,.4,1,bowl);ball(.11,M.egg,.12,0,.18,1.2,.5,1,bowl);
for(const s of[-1,1])ball(.17,M.fur,s*.42,.08,.1,1,.8,1.2,bowl);
const steam=[];const sm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7});
function puff(){const p=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),sm.clone());p.position.set((Math.random()-.5)*.4,0,(Math.random()-.5)*.3);p.userData.a=.7;bowl.add(p);steam.push(p)}
const sh=new THREE.Mesh(new THREE.CircleGeometry(1.4,40),new THREE.MeshBasicMaterial({color:0x8a6a4a,transparent:true,opacity:.18}));sh.rotation.x=-Math.PI/2;sh.position.y=.01;scene.add(sh);
const lines=['嗦——','烫烫烫','转晕了','给你留了一口','螺蛳粉照片呢','再戳就要洒了','哼'];let hops=0,vy=0,y=0,sq=0;
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();let down=null;
cv.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;const r=cv.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pt,cam);
 if(ray.intersectObject(ham,true).length&&y<.01){vy=.16;sq=-.2;say.textContent=lines[hops++%lines.length];for(let i=0;i<5;i++)puff()}});
function size(){const w=cv.clientWidth;R.setSize(w,w,false);cam.aspect=1;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
let t=0;R.setAnimationLoop(()=>{t++;
 if(y>0||vy>0){vy-=.012;y+=vy;if(y<=0){y=0;vy=0;sq=.25}}sq*=.88;
 ham.position.y=y;body.scale.set(1+sq*.4,1-sq*.5+Math.sin(t/30)*.015,1+sq*.4);
 head.rotation.z=Math.sin(t/50)*.06;sh.scale.setScalar(1-y*.25);
 if(t%25==0)puff();for(let i=steam.length-1;i>=0;i--){const p=steam[i];p.position.y+=.008;p.position.x+=Math.sin((t+i*7)/12)*.002;p.userData.a-=.005;p.material.opacity=p.userData.a;p.scale.setScalar(1+(.7-p.userData.a)*2);if(p.userData.a<=0){bowl.remove(p);steam.splice(i,1)}}
 ctl.update();R.render(scene,cam)});
</script>
