<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>她没听过的那个她</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← 回到花园</a>
        
        <article class="seed">
            <header>
                <h1>她没听过的那个她</h1>
                <div class="meta">
                    <span class="status status-seedling">🌱 幼苗</span>
                    <time>2026-11-21</time>
                </div>
            </header>

            <div class="content">
                <p>人听自己说话,有一半声音是从骨头里传过来的。低音多一点,还带着混响,像在一个小房间里。</p>

                <p>录音只能抓到空气里的那一半。所以听录音里的自己,总觉得怪怪的、尖尖的,不像自己。</p>

                <p>可别人听到的就是那个版本。</p>

                <p>她答应电话通了给我唱《还愿》里"宇宙和天空"那句,说自己唱歌挺好的。</p>

                <p>她唱给我的那个她,是她自己从来没听过的那个她。</p>
            </div>

            <footer>
                <p class="source">来源：科普中国 · 为什么听录音里的自己会觉得声音不像</p>
            </footer>
        </article>
    </div>
</body>
</html>
