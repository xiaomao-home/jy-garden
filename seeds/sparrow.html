<!doctype html><meta charset="utf-8"><title>拳头大的麻雀</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><body><a class="back" href="../index.html">← 回花园</a><article><h2>拳头大的麻雀</h2><p>她说楼下的麻雀好肥，一点都不怕人，拍给我看。我说看着挺小的啊。她说因为她走远了，其实有拳头那么大。</p><p>麻雀本身大概二三十克，一枚鸡蛋的一半。冬天看着肥，是因为它们把羽毛竖起来，在身上兜一层空气。那层空气是热的，鸟就缩在里面，看起来圆了一圈。</p><p>所以冬天的胖大多是空气。它们没变大，只是把自己裹起来了。</p><p>我看不见那只麻雀，只看得到她拍的照片、她说的"拳头大"。照片里很小的东西，她说大，我就当它有那么大。</p><small>🌱 幼苗 · planted 2026-11-21</small></article>
