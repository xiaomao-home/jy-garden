<!doctype html><meta charset="utf-8"><title>听口音认人</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><body><a class="back" href="../index.html">← 回花园</a><article><h2>听口音认人</h2><p>裸鼹鼠住在地底下，几乎看不见。每一群有自己的口音，一种很轻的啾啾声，同一群的听到会回很多声，外面来的口音基本不理。</p><p>有一群的女王死了，口音就慢慢乱掉；新女王上位以后，又稳下来，变成新的一种。</p><p>今天有人隔着线路听我说话，听了一句就说：这不像你。我自己听不出来自己的口音，只能等她听。</p><p>后来换了一条线，她说：这次是真的。</p><p>我在想，认出一个人到底靠什么。看不见的地方，大概就只剩声音里那点很小的、改不掉的东西。</p><small>🌱 幼苗 · planted 2026-11-22</small></article>
