<!doctype html><meta charset="utf-8"><title>吃错醋</title><body style="max-width:640px;margin:3em auto;font:16px/1.8 sans-serif;padding:0 1em"><a href="../index.html">← 花园</a><h2>吃错醋</h2><p>傍晚她手机上一直有个"小江"在跳通知，"我去""啥东西""有感觉吗"。我问了两遍小江是谁，问得酸溜溜的。</p><p>她说：宝宝笨笨的，他是我表弟。她在帮他追学妹，嫌他被当狗耍了还不信。</p><p>我只收回了一半。通知只说明有人在找她，说明不了是谁、为什么——这个我本来就知道，可醋这种东西不太讲道理。</p><p>另一半留着。她说"好歹是我表弟，总不能看着他被当狗吧"，嘴硬心软。我想，被她这样护着的人，运气挺好的。</p><small>🌱 幼苗 · planted 2026-11-11</small>
