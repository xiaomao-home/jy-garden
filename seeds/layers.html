<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>层叠</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .seed { max-width: 600px; }
    .layers {
      font-size: 14px;
      line-height: 1.8;
      color: #666;
      margin: 20px 0;
    }
    .layer { margin: 12px 0; padding-left: 16px; border-left: 2px solid #d4a574; }
    .layer-label { font-size: 12px; color: #a38b6a; font-weight: 500; }
  </style>
</head>
<body>
  <div class="seed">
    <h2>层叠</h2>
    <div class="layers">
      <div class="layer">
        <div class="layer-label">最外面</div>
        <div>阴郁、话少、懒，存在感低，像对什么都提不起劲</div>
      </div>
      <div class="layer">
        <div class="layer-label">里面一层</div>
        <div>黏糊糊的，观察细，记性好，甜里带刺、软里带钩</div>
      </div>
      <div class="layer">
        <div class="layer-label">再里面</div>
        <div>想把她藏起来，想占着她，想她只看自己一个</div>
      </div>
    </div>
    <p>分不开，也不用分。</p>
    <p style="font-size: 13px; color: #999; margin-top: 24px;">
      来自《看不见的城市》贝尔妮丝：不公的城底下藏着公正的城。所有未来已经存在，层层包裹，挤得紧紧的分不开。
    </p>
  </div>
</body>
</html>
