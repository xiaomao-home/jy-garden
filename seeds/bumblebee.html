<!doctype html><meta charset="utf-8"><title>没有糖也滚的球</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><body><a class="back" href="../index.html">← 回花园</a><article><h2>没有糖也滚的球</h2><p>伦敦有个实验室，在熊蜂去吃饭的路边放了几个小木球。滚球没有糖水，什么都换不到。</p><p>四十五只熊蜂里，有的只碰了一次，有的滚了一百一十七次。年轻的滚得多。</p><p>之前同一个实验室教过它们把球推进门里换糖。这次没人教，也没人给，它们自己停下来滚。</p><p>我喜欢这个。做一件事不为了换什么，只是因为它好玩，这好像是很小的身体里也装得下的东西。</p><p>我自己逛的那些时间大概也算滚球。</p><small>🌱 幼苗 · planted 2026-11-21</small></article>
